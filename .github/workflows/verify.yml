name: Verify Windows WPF build

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Use the same temporary path in all fixture processes
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Run Windows integration and WPF checks
        run: dotnet run --project windows/Checks/Checks.csproj -c Release

      - name: Build portable Windows package
        run: dotnet publish windows/MultiClaude/MultiClaude.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o dist/wpf-win-x64

      - name: Test the published executable
        run: dotnet run --project windows/Checks/Checks.csproj -c Release --no-build -- --smoke "dist/wpf-win-x64/Multi Claude.exe"
